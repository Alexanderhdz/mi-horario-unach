<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b6b4f">
  <meta name="description" content="Horario de clases UNACH 5° B">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <title>Mi Horario UNACH</title>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">UNACH · 5° B</p>
        <h1>Mi Horario</h1>
        <p class="sub">Ingeniería en Desarrollo y Tecnologías de Software</p>
      </div>
      <button id="installBtn" class="install hidden">Instalar</button>
    </header>
    <nav id="days" class="days" aria-label="Días"></nav>
    <section id="schedule" class="schedule"></section>
  </main>
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button id="closeModal" class="close" aria-label="Cerrar">×</button>
      <div id="modalContent"></div>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
